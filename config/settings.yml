redis_url: redis://localhost:6379/

lybercore_log: 'log/lybercore.log'

# where to find the deposit bag to be preserved
transfer_object:
  from_dir: '/dor/export/'

moab:
  # storage_roots:
  #   - '/services-disk/store1'
  #   - '/services-disk/store2'
  storage_trunk: 'sdr2objects'
  deposit_trunk: 'deposit'
  path_method: 'druid_tree'

ceph:
  # How to invoke the `ceph` CLI for the capability queries below.
  cli:
    executable: 'ceph'
    conf: ~
    name: ~
    keyring: ~
    connect_timeout: 30
  # Before reading paths that another preservation_robots host may have just written,
  # wait for that host's CephFS client to release its write capabilities on them.
  # Requires a keyring with `mds allow *`, so this is off until one is deployed.
  # See "Waiting on CephFS write capabilities" in the README.
  write_capability_check:
    enabled: false
    filesystem_name: 'sdr'
    # Local mount points, and where each one sits within the CephFS namespace.
    mounts:
      - mount_point: '/services-disk'
        cephfs_root: '/'
    # Which MDS ranks to query; empty means ask the cluster which ranks are in.
    ranks: []
    # Defaults to this host's name per Socket.gethostname.
    local_hostname: ~
    # Seconds to wait for other hosts to release write capabilities before giving up.
    max_wait: 120
    poll_interval: 2

preservation_catalog:
  url: 'http://localhost:3000'
  token: 'YOUR_TOKEN_HERE'

email_addresses:
  discussion_list: 'user@discussion_list.org'
  user_list: 'user@user_list.org'

dor_services:
  url:  'https://dor-services-test.stanford.test'
  token: secret-token